name: testing
version: 1.0.0
description: APM project for testing
author: Oliver Hook
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, hermes, kiro, opencode, vscode, windsurf
targets:
  - copilot
  - cursor
dependencies:
  apm:
    # Quote entries so YAML does not treat # as a comment.
    # Prefer ">=x.y.0 <1.0.0" over ^x.y.0: for 0.x, caret only allows patch bumps.
    - "porsche-design-system/skills/packages/web-accessibility-codegen#>=0.2.0 <1.0.0"
    - "porsche-design-system/skills/packages/web-accessibility-audit#>=0.4.0 <1.0.0"
  mcp: []
includes: auto
scripts: {}
