name: 'Test'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit-ui-testing:
    name: 'Unit (UI Testing)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run test:unit:ui-testing
        shell: bash

  e2e-ui-testing:
    name: 'E2E (UI Testing)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: 'Install'
        uses: ./.github/actions/install
      # Build is done in Playwright webServer without NEXT_PUBLIC_BASE_PATH (deploy artifact uses base path).
      - run: npm run test:e2e:ui-testing
        shell: bash

  a11y-ui-testing:
    name: 'A11y (UI Testing)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run test:a11y:ui-testing
        shell: bash
