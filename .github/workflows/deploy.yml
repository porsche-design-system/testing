name: 'Deploy'

on:
  workflow_call:
    inputs:
      gh-pages-slug:
        description: 'Deploy target slug (e.g. "nightly", "pr-123"), used as the gh-pages folder.'
        required: true
        type: string

permissions:
  contents: write

env:
  BRANCH_BASE_PATH: ${{ inputs.gh-pages-slug }}

jobs:
  deploy:
    name: 'UI Testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
      - name: 'Ensure .nojekyll exists'
        run: touch .nojekyll
        shell: bash
      - name: 'Clean'
        run: |
          rm -rf "./${{ env.BRANCH_BASE_PATH }}"
        shell: bash
      - name: 'Download artifact "UI Testing"'
        uses: actions/download-artifact@v4
        with:
          name: build-ui-testing
          path: "./${{ env.BRANCH_BASE_PATH }}/ui-testing/"
      - name: 'Deploy'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git commit -m "Automated deployment to GitHub Pages (${{ github.ref_name }}): ${{ github.sha }}" --allow-empty
          git push origin gh-pages --force
        shell: bash
