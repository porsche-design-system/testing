name: 'Build'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string
      gh-pages-slug:
        description: 'Deploy target slug (e.g. "pr-123"), used as the base path segment. Empty string for main branch (no slug).'
        required: true
        type: string

permissions:
  contents: read

env:
  BRANCH_BASE_PATH: ${{ inputs.gh-pages-slug }}

jobs:
  ui-testing:
    name: 'UI Testing'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Resolve base path'
       id: base-path
       run: |
         if [[ -n "${{ env.BRANCH_BASE_PATH }}" ]]; then
           echo "value=/testing/${{ env.BRANCH_BASE_PATH }}/ui-testing" >> "$GITHUB_OUTPUT"
         else
           echo "value=/testing/ui-testing" >> "$GITHUB_OUTPUT"
         fi
       shell: bash
      - run: npm run build:ui-testing
       env:
         NEXT_PUBLIC_BASE_PATH: "${{ steps.base-path.outputs.value }}"
          # Public FullStory/Usetiful snippet id; omitted from local/dev and Playwright builds.
          NEXT_PUBLIC_FULLSTORY_ORG_ID: 'o-ARNQ-eu1'
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: build-ui-testing
          path: ./ui-testing/dist/
